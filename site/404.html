<style>
:root{

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}

.logo{width:40px;height:40px;flex:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px}

.card > p{color:var(--muted)}
ul{list-style:none;padding:0;margin-top:18px;display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:10px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:700;text-align:center;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
