[package]
name = "flashka-fw"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[dependencies]
# All flashlight logic (profiles, buttons, gestures, presenter mode, protection,
# packets, settings, bonds) is in the host-tested flashka-core crate; this crate
# only does I/O.
flashka-core = { path = "../flashka-core" }

esp-hal = { version = "=1.1.2", features = ["esp32c3", "unstable"] }
esp-rtos = { version = "=0.3.0", features = ["esp32c3", "embassy", "esp-radio", "esp-alloc"] }
esp-radio = { version = "=0.18.0", features = ["esp32c3", "ble", "unstable", "esp-alloc"] }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c3"] }
esp-alloc = "=0.10.0"
# USB-Serial-JTAG only: the default "auto" backend falls back to UART0, whose
# TX pin (GPIO21) drives the red cathode of the RGB LED on this board.
esp-println = { version = "=0.17.0", default-features = false, features = ["esp32c3", "log-04", "jtag-serial", "critical-section"] }
# Flash access for the settings log (same release train as esp-hal 1.1.x).
esp-storage = { version = "=0.9.0", features = ["esp32c3"] }
embedded-storage = "0.3.1"
log = "0.4"
embassy-executor = { version = "0.10" }
embassy-time = "0.5"
# Must be 0.7: the trouble-host 0.6 GATT macros generate code that names
# `embassy_sync::blocking_mutex::raw::{NoopRawMutex, RawMutex}` and need the
# trait of the embassy-sync version trouble-host itself uses (0.7.x).
embassy-sync = "0.7"
embassy-futures = "0.1"
# "security": LE Secure Connections pairing and bonding (presenter mode).
# "connection-event-queue-size-8": the default queue of 2 can overflow during
# pairing and then the bond is lost (see docs/firmware.md).
trouble-host = { version = "=0.6.0", features = ["gatt", "peripheral", "derive", "security", "connection-event-queue-size-8"] }
bt-hci = "0.8"
# HCI transport wrapper (src/hci.rs): the embedded-io version bt-hci 0.8 uses.
embedded-io = "0.7"
static_cell = "2"
heapless = "0.9"
critical-section = "1"

# Board variant: no feature = FlashKa Keychain v0.6 (image flashka-fw-v0.6.0), `board-v07` = FlashKa
# Keychain v0.7 (image flashka-fw-v0.7.0). build.sh selects it with BOARD=v06 / BOARD=v07.
[features]
board-v07 = ["flashka-core/board-v07"]
