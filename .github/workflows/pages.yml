# SPDX-License-Identifier: GPL-3.0-or-later
# Publishes the web site on GitHub Pages:
#   https://dompka.github.io/LuxLibre/          landing page (site/)
#   https://dompka.github.io/LuxLibre/flashka/  FlashKa v0.6 menu, control app and firmware installer
#                                               (hardware/flashka-keychain-v06/app/, without the screenshots)
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# This workflow only builds and deploys the site. It never commits, pushes, tags or opens pull requests.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "hardware/flashka-keychain-v06/app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer run waits; a deployment in progress is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble _site
        shell: bash
        run: |
          set -euo pipefail
          app=hardware/flashka-keychain-v06/app
          rm -rf _site
          mkdir -p _site/flashka
          cp -R site/. _site/
          cp "$app/index.html" "$app/flashka-app.html" "$app/flashka-flasher.html" _site/flashka/
          touch _site/.nojekyll
          find _site -type f -printf '%10s  %p\n' | sort -k2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
